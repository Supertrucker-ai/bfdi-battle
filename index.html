<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--ink:#1b1b2f;--gold:#ffc83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;margin:0;padding:0}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#5fc3ff}
body{font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 60% 40% at 18% 12%,rgba(255,255,255,.55),transparent 70%),radial-gradient(ellipse 50% 30% at 85% 22%,rgba(255,255,255,.45),transparent 70%),linear-gradient(#49b4ff 0%,#a8e2ff 72%,#8fdc5a 72.2%,#5cbf35 100%)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:stretch;padding:calc(var(--sat) + 6px) calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);max-width:1000px;margin:0 auto}
.screen.on{display:flex;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.outline{color:#fff;text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 5px 0 var(--ink)}
.topbar{display:flex;align-items:center;gap:8px;min-height:56px;flex:none}
.topbar .grow{flex:1;min-width:0}
.gear{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #2b6ea8;display:flex;align-items:center;justify-content:center;flex:none}
.gear:active{transform:translateY(3px);box-shadow:0 1px 0 #2b6ea8}
.gear svg{width:34px;height:34px}
.btn{border-radius:22px;font-weight:900;color:#fff;background:#ff7a1a;box-shadow:0 6px 0 #b34d00,0 9px 14px rgba(0,0,0,.18);padding:10px 22px;font-size:26px;min-height:64px;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.28);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b34d00}
.btn.green{background:#2fbf4a;box-shadow:0 6px 0 #1a7a2c,0 9px 14px rgba(0,0,0,.18)}
.btn.green:active{box-shadow:0 1px 0 #1a7a2c}
.btn.blue{background:#2f8cff;box-shadow:0 6px 0 #1a5cb3,0 9px 14px rgba(0,0,0,.18)}
.btn.blue:active{box-shadow:0 1px 0 #1a5cb3}
.btn.small{font-size:19px;min-height:52px;padding:8px 16px;border-radius:18px}
.btn[disabled]{filter:grayscale(1);opacity:.55}
.csvg{display:block;width:100%;height:100%;overflow:visible}
.sel-head{text-align:center;flex:none}
.logo{font-size:clamp(30px,9vw,52px);font-weight:900;line-height:1.05;letter-spacing:1px}
.logo small{display:block;font-size:.42em;letter-spacing:0;margin-top:2px}
.stats{display:flex;gap:8px;justify-content:center;margin:6px 0 6px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.9);border-radius:999px;padding:4px 12px 4px 6px;font-weight:900;font-size:18px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.pill svg{width:26px;height:26px}
.grid-wrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;border-radius:22px;background:rgba(255,255,255,.35);padding:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px}
.card{background:#fff;border-radius:18px;padding:6px 4px 8px;box-shadow:0 4px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;border:4px solid transparent;touch-action:pan-y;min-height:128px}
.card .pic{width:88%;aspect-ratio:128/130}
.card .nm{font-weight:900;font-size:15px;text-align:center;line-height:1.1;margin-top:2px}
.card.sel{border-color:#ff7a1a;background:#fff3c4;transform:scale(1.04)}
.card.rand .pic{display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;color:#ff7a1a}
.sel-bar{flex:none;display:flex;align-items:center;gap:10px;margin-top:10px;background:#fff;border-radius:22px;padding:8px 10px;box-shadow:0 5px 0 rgba(0,0,0,.15);min-height:84px}
.sel-bar .av{width:66px;height:66px;flex:none}
.sel-bar .who{flex:1;min-width:0;font-weight:900;font-size:22px;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.sel-bar .who small{display:block;font-size:14px;color:#666}
.steps{display:flex;gap:6px;justify-content:center;flex:none;margin:2px 0 6px}
.step{background:rgba(255,255,255,.6);border-radius:999px;padding:5px 10px;font-weight:900;font-size:13px;color:#445}
.step.now{background:#ff7a1a;color:#fff;transform:scale(1.1);box-shadow:0 3px 0 #b34d00}
.step.done{background:#2fbf4a;color:#fff}
.bracket{flex:1;min-height:0;position:relative;background:rgba(255,255,255,.35);border-radius:22px}
.bracket svg.lines{position:absolute;inset:0;width:100%;height:100%}
.bav{position:absolute;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2);transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.bav .inner{width:112%;height:112%;margin-top:6%;flex:none}
.bav.q{background:rgba(255,255,255,.6);color:#789;font-weight:900}
.bav.out{opacity:.35;filter:grayscale(1)}
.bav.you{box-shadow:0 0 0 4px var(--gold),0 0 0 6px var(--ink)}
.bav.next{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px #ff3b3b}50%{box-shadow:0 0 0 7px #ff3b3b}}
.bav.pop{animation:pop .6s}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2)}70%{transform:translate(-50%,-50%) scale(1.25)}100%{transform:translate(-50%,-50%) scale(1)}}
.champ-slot{position:absolute;transform:translate(-50%,-50%)}
.next-panel{flex:none;margin-top:8px;background:#fff;border-radius:22px;padding:8px 10px 10px;box-shadow:0 5px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;gap:6px}
.vsrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.vsrow .side{display:flex;flex-direction:column;align-items:center;width:40%;min-width:0}
.vsrow .av{width:70px;height:72px}
.vsrow .nm{font-weight:900;font-size:17px;text-align:center;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.vs{font-size:30px;font-weight:900;color:#ff3b3b}
.next-panel .btn{width:100%}
.round-label{font-size:clamp(20px,6vw,30px);font-weight:900;text-align:center}
.scoreboard{flex:none;display:flex;align-items:stretch;gap:8px}
.sb{flex:1;min-width:0;background:#fff;border-radius:16px;padding:5px 8px;box-shadow:0 4px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center}
.sb .nm{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sb.you .nm{color:#1a7a2c}.sb.opp .nm{color:#c62828}
.pips{display:flex;gap:8px;margin-top:3px}
.pip{width:24px;height:24px;border-radius:50%;border:3px solid var(--ink);background:#e8e8e8}
.pip.on{background:var(--gold);animation:pop2 .4s}
@keyframes pop2{50%{transform:scale(1.5)}}
.bo3{align-self:center;font-weight:900;font-size:13px;text-align:center;color:#fff;background:var(--ink);border-radius:10px;padding:4px 6px;line-height:1.1}
.arena{flex:1;min-height:0;position:relative;margin:4px 0}
.fighter{position:absolute;bottom:4%;width:48%;height:60%;display:flex;align-items:flex-end;justify-content:center}
.fighter.left{left:1%}.fighter.right{right:1%}
.fig{height:100%;aspect-ratio:128/130;max-width:100%;position:relative}
.fig.bob{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.fig.shake{animation:shk .24s ease-in-out infinite alternate}
@keyframes shk{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-10px) rotate(2deg)}}
.fig.bounce{animation:bnc .45s cubic-bezier(.3,0,.5,1) infinite alternate}
@keyframes bnc{from{transform:translateY(0) scale(1.05,.95)}to{transform:translateY(-22%) scale(.97,1.03)}}
.fig.flingL{animation:flingL 1.3s cubic-bezier(.3,.1,.8,.6) forwards}
@keyframes flingL{0%{transform:none}15%{transform:translate(8%,4%) scale(1.1,.85)}100%{transform:translate(-260%,-420%) rotate(-1080deg) scale(.5)}}
.fig.flingR{animation:flingR 1.3s cubic-bezier(.3,.1,.8,.6) forwards}
@keyframes flingR{0%{transform:none}15%{transform:translate(-8%,4%) scale(1.1,.85)}100%{transform:translate(260%,-420%) rotate(1080deg) scale(.5)}}
.fig.hit{animation:hit .3s}
@keyframes hit{30%{transform:translateX(-8%) rotate(-8deg)}60%{transform:translateX(6%) rotate(5deg)}}
.throw{position:absolute;width:min(30vw,21vh,150px);aspect-ratio:1;bottom:72%;opacity:0;pointer-events:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.fighter.left .throw{right:-6%}.fighter.right .throw{left:-6%}
.throw.show{opacity:1;animation:thr .35s cubic-bezier(.2,1.6,.5,1)}
@keyframes thr{from{transform:scale(.1) rotate(-40deg)}to{transform:none}}
.throw.lose{filter:grayscale(.8) opacity(.6)}
.throw.win{animation:thr .35s cubic-bezier(.2,1.6,.5,1),glow .6s .35s infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 4px #ffe066)}}
.cmsg{position:absolute;left:0;right:0;top:4%;text-align:center;font-weight:900;pointer-events:none;z-index:5}
.cmsg .big{font-size:clamp(34px,11vw,64px);line-height:1}
.cmsg .sub{font-size:clamp(18px,5vw,26px);margin-top:4px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);color:var(--ink);border-radius:14px;padding:3px 10px;text-shadow:none}
.cmsg .sub svg{width:34px;height:34px}
.cmsg.pop .big{animation:cpop .35s cubic-bezier(.2,1.6,.5,1)}
@keyframes cpop{from{transform:scale(.3)}to{transform:none}}
.bubble{position:absolute;right:3%;top:26%;max-width:62%;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px 12px;font-weight:900;font-size:clamp(17px,4.8vw,22px);line-height:1.15;z-index:6;opacity:0;transform:scale(.6);transform-origin:80% 100%;transition:opacity .15s,transform .2s cubic-bezier(.2,1.6,.5,1);pointer-events:none}
.bubble.show{opacity:1;transform:none}
.bubble:after{content:"";position:absolute;right:22%;bottom:-17px;border:9px solid transparent;border-top:12px solid var(--ink)}
.bubble:before{content:"";position:absolute;right:calc(22% + 3px);bottom:-10px;border:6px solid transparent;border-top:9px solid #fff;z-index:1}
.pow{position:absolute;width:90px;height:90px;z-index:7;pointer-events:none;animation:powa .7s forwards}
@keyframes powa{0%{transform:scale(.2) rotate(-20deg);opacity:1}40%{transform:scale(1.2) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:0}}
.picks{flex:none;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pick{border-radius:22px;background:#fff;box-shadow:0 6px 0 var(--sh),0 8px 12px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px 8px;min-height:clamp(96px,16vh,140px);border:4px solid var(--c)}
.pick svg{width:clamp(52px,14vw,80px);height:clamp(52px,14vw,80px);max-height:9vh}
.pick span{font-weight:900;font-size:clamp(15px,4.4vw,22px);color:var(--c);margin-top:2px}
.pick:active{transform:translateY(5px);box-shadow:0 1px 0 var(--sh)}
.pick[disabled]{opacity:.55;filter:grayscale(.85)}
.pick.chosen{opacity:1;background:#fff3c4;transform:translateY(3px) scale(1.04)}
.pick.r{--c:#8a5a2b;--sh:#6a4420}.pick.p{--c:#1f6fd6;--sh:#174f99}.pick.s{--c:#d6336c;--sh:#9c2450}
.tap-hint{position:absolute;left:0;right:0;bottom:4%;text-align:center;font-weight:900;font-size:clamp(20px,5.5vw,28px);pointer-events:none;animation:hint 1s ease-in-out infinite alternate;z-index:4}
@keyframes hint{to{transform:translateY(8px)}}
.center-col{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.bigtitle{font-size:clamp(30px,9vw,56px);font-weight:900;line-height:1.05}
.msg{font-size:clamp(20px,5.5vw,28px);font-weight:900;background:rgba(255,255,255,.9);border-radius:18px;padding:6px 14px;max-width:95%}
.scene{position:relative;width:min(92vw,440px,52vh);aspect-ratio:300/230}
.scene > svg{position:absolute;inset:0;width:100%;height:100%}
.scene .who{position:absolute}
.btncol{display:flex;flex-direction:column;gap:14px;width:min(100%,420px);flex:none}
.btncol .btn{width:100%}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#s-champ .center-col{position:relative;z-index:2}
.champ-title{font-size:clamp(28px,8.6vw,54px);font-weight:900;line-height:1.05;animation:wob 1.2s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.06)}}
.trophy-float{animation:tf 1s ease-in-out infinite alternate}
@keyframes tf{to{transform:translateY(-8%)}}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 10px)}
.modal.on{display:flex;animation:fadein .2s}
.panel{background:#fff;border-radius:26px;padding:18px;width:min(100%,400px);display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.panel h2{font-size:30px;text-align:center}
.panel .statline{text-align:center;font-weight:900;font-size:18px;color:#555}
@media (orientation:landscape) and (max-height:500px){
  .logo{font-size:30px}.logo small{display:inline;margin-left:8px}
  .stats{margin:2px 0}
  .pick{min-height:70px;flex-direction:row;gap:8px}
  .pick svg{width:44px;height:44px}
  .next-panel{flex-direction:row}.next-panel .btn{width:auto;flex:none}
  .vsrow .av{width:52px;height:54px}
  .scene{width:min(40vw,36vh*1.3)}
  .steps{display:none}
  .topbar{min-height:48px}.gear{width:48px;height:48px}
  .next-panel{margin-top:6px;padding:4px 10px}
  .vsrow .av{width:44px;height:46px}
  .fighter{height:70%}
}
@media (min-width:700px) and (min-height:600px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(122px,1fr))}
  .card .nm{font-size:17px}
}
</style>
</head>
<body>
<div id="app">

<section class="screen" id="s-select">
  <div class="topbar">
    <div class="grow"></div>
    <div class="sel-head grow" style="flex:4"><div class="logo outline">BFDI Battle<small>Rock Paper Scissors!</small></div></div>
    <div class="grow" style="display:flex;justify-content:flex-end"><button class="gear" data-act="settings" aria-label="Settings"></button></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="grid-wrap scroll" id="gridwrap"><div class="grid" id="grid"></div></div>
  <div class="sel-bar" id="selbar">
    <div class="av" id="sel-av"></div>
    <div class="who" id="sel-who">Tap a character!<small>Who will you be?</small></div>
    <button class="btn green" id="btn-play" disabled>PLAY!</button>
  </div>
</section>

<section class="screen" id="s-bracket">
  <div class="topbar">
    <div style="width:54px"></div>
    <div class="grow round-label outline" id="br-title">Tournament</div>
    <button class="gear" data-act="settings" aria-label="Settings"></button>
  </div>
  <div class="steps" id="steps"></div>
  <div class="bracket" id="bracket"></div>
  <div class="next-panel" id="nextpanel"></div>
</section>

<section class="screen" id="s-match">
  <div class="topbar">
    <div style="width:54px"></div>
    <div class="grow round-label outline" id="m-round">Round of 16</div>
    <button class="gear" data-act="settings" aria-label="Settings"></button>
  </div>
  <div class="scoreboard">
    <div class="sb you"><div class="nm" id="m-youname">You</div><div class="pips" id="pips-you"></div></div>
    <div class="bo3">BEST<br>OF 3</div>
    <div class="sb opp"><div class="nm" id="m-oppname">Opp</div><div class="pips" id="pips-opp"></div></div>
  </div>
  <div class="arena" id="arena">
    <div class="fighter left" id="f-you"><div class="throw" id="t-you"></div><div class="fig" id="fig-you"></div></div>
    <div class="fighter right" id="f-opp"><div class="throw" id="t-opp"></div><div class="fig" id="fig-opp"></div></div>
    <div class="bubble" id="bubble"></div>
    <div class="cmsg outline" id="cmsg"></div>
    <div class="tap-hint outline" id="taphint">Pick one! &#8595;</div>
  </div>
  <div class="picks" id="picks">
    <button class="pick r" data-m="0" aria-label="Rock"><span class="ic"></span><span>ROCK</span></button>
    <button class="pick p" data-m="1" aria-label="Paper"><span class="ic"></span><span>PAPER</span></button>
    <button class="pick s" data-m="2" aria-label="Scissors"><span class="ic"></span><span>SCISSORS</span></button>
  </div>
</section>

<section class="screen" id="s-recovery">
  <div class="topbar"><div class="grow"></div><button class="gear" data-act="settings" aria-label="Settings"></button></div>
  <div class="center-col">
    <div class="bigtitle outline">Oh no!</div>
    <div class="scene" id="rec-scene"></div>
    <div class="msg" id="rec-msg">You got flung to the Recovery Center!</div>
    <div class="btncol">
      <button class="btn green" id="btn-retry"><svg viewBox="0 0 40 40" width="34" height="34"><path d="M32 20a12 12 0 1 1-4-9" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M30 3v10H20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>TRY AGAIN</button>
      <button class="btn blue small" data-act="new">New Tournament</button>
    </div>
  </div>
</section>

<section class="screen" id="s-champ">
  <canvas id="confetti"></canvas>
  <div class="topbar" style="position:relative;z-index:2"><div class="grow"></div><button class="gear" data-act="settings" aria-label="Settings"></button></div>
  <div class="center-col">
    <div class="champ-title outline">CHAMPION OF<br>DREAM ISLAND!</div>
    <div class="scene" id="champ-scene"></div>
    <div class="msg" id="champ-msg"></div>
    <div class="btncol"><button class="btn green" data-act="new">PLAY AGAIN</button></div>
  </div>
</section>

<div class="modal" id="settings">
  <div class="panel">
    <h2>Settings</h2>
    <button class="btn blue" id="btn-sound">Sound: ON</button>
    <button class="btn" data-act="new">New Tournament</button>
    <div class="statline" id="set-stats"></div>
    <button class="btn green small" id="btn-close">Close</button>
  </div>
</div>
</div>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var params=new URLSearchParams(location.search);
var SPEED=params.has('fast')?0.1:1;
function wait(ms){return new Promise(function(r){setTimeout(r,ms*SPEED)})}
function rnd(n){return Math.floor(Math.random()*n)}
function pick(a){return a[rnd(a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}

/* ===== STORAGE: localStorage -> window.name -> memory ===== */
var Store=(function(){
  var KEY='bfdiBattle.v1',PFX='BFDIBATTLE:',mode='memory',mem={};
  function readName(){try{if(typeof window.name==='string'&&window.name.indexOf(PFX)===0)return JSON.parse(window.name.slice(PFX.length))}catch(e){}return null}
  function load(){
    try{var ls=window.localStorage;ls.setItem(KEY+'.t','1');ls.removeItem(KEY+'.t');mode='local';var v=ls.getItem(KEY);mem=v?JSON.parse(v):(readName()||{});return}catch(e){}
    try{var n=readName();window.name=window.name;mode='name';mem=n||{};return}catch(e){}
    mode='memory';mem={};
  }
  function save(){
    var s=JSON.stringify(mem);
    if(mode==='local'){try{localStorage.setItem(KEY,s);return}catch(e){mode='name'}}
    if(mode==='name'){try{window.name=PFX+s;return}catch(e){mode='memory'}}
  }
  load();
  return{get:function(k,d){return mem[k]===undefined?d:mem[k]},set:function(k,v){mem[k]=v;save()},inc:function(k){mem[k]=(mem[k]||0)+1;save();return mem[k]},mode:function(){return mode}};
})();

/* ===== SOUND: WebAudio synth, unlocked on first tap ===== */
var Snd={ctx:null,master:null,on:Store.get('sound',true),
  unlock:function(){
    try{
      if(!this.ctx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=0.5;this.master.connect(this.ctx.destination)}
      if(this.ctx.state!=='running')this.ctx.resume();
      var b=this.ctx.createBuffer(1,1,22050),s=this.ctx.createBufferSource();s.buffer=b;s.connect(this.ctx.destination);s.start(0);
    }catch(e){}
  },
  tone:function(f,d,type,vol,when,to){
    var c=this.ctx,t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+0.05);
  },
  noise:function(d,vol,when,f1,f2){
    var c=this.ctx,t=c.currentTime+(when||0),len=Math.floor(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),a=b.getChannelData(0);
    for(var i=0;i<len;i++)a[i]=Math.random()*2-1;
    var s=c.createBufferSource();s.buffer=b;var fl=c.createBiquadFilter();fl.type='bandpass';fl.Q.value=1.2;fl.frequency.setValueAtTime(f1||1000,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    var g=c.createGain();g.gain.setValueAtTime(vol||0.3,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(this.master);s.start(t);s.stop(t+d+0.05);
  },
  play:function(n){
    if(!this.on||!this.ctx||this.ctx.state!=='running')return;
    var T=this;
    try{switch(n){
      case 'tap':T.tone(660,0.07,'square',0.12);break;
      case 'select':T.tone(523,0.08,'square',0.12);T.tone(784,0.1,'square',0.12,0.07);break;
      case 'tick':T.tone(440,0.12,'triangle',0.3);break;
      case 'shoot':T.tone(880,0.2,'square',0.2);T.noise(0.15,0.25,0,2000);break;
      case 'win':[523,659,784,1047].forEach(function(f,i){T.tone(f,0.14,'square',0.14,i*0.08)});break;
      case 'lose':[392,330,262].forEach(function(f,i){T.tone(f,0.2,'sawtooth',0.1,i*0.14)});break;
      case 'tie':T.tone(300,0.25,'sine',0.35,0,600);T.tone(600,0.25,'sine',0.3,0.2,300);break;
      case 'whoosh':T.noise(0.8,0.4,0,300,3000);T.tone(700,0.8,'sine',0.12,0,120);break;
      case 'bonk':T.tone(180,0.15,'square',0.25,0,60);T.noise(0.1,0.3,0,600);break;
      case 'cheer':T.noise(1.2,0.18,0,1500,2500);[523,659,784,1047,784,1047].forEach(function(f,i){T.tone(f,0.12,'square',0.1,i*0.1)});break;
      case 'fanfare':[[523,0],[523,.15],[523,.3],[659,.45],[784,.75],[659,1.0],[784,1.15],[1047,1.35]].forEach(function(p){T.tone(p[0],0.3,'square',0.13,p[1]);T.tone(p[0]/2,0.3,'triangle',0.15,p[1])});T.noise(2,0.1,0.4,2000,3000);break;
      case 'sad':[330,311,294,262].forEach(function(f,i){T.tone(f,0.35,'triangle',0.2,i*0.3)});break;
    }}catch(e){}

/* ===== FACE + LIMBS ===== */
function face(x,y,s,ex,light){
  var dx=9.5*s,rx=6.2*s,ry=8*s,pr=3.3*s,px=1.7*s,py=.6*s,o='',lw=1.5;
  var mc=light?'#fff':'#000';
  var ex1=x-dx,ex2=x+dx;
  if(ex==='dizzy'){
    [ex1,ex2].forEach(function(cx){o+='<path d="M'+(cx-rx*.8)+' '+(y-ry*.6)+' L'+(cx+rx*.8)+' '+(y+ry*.6)+' M'+(cx+rx*.8)+' '+(y-ry*.6)+' L'+(cx-rx*.8)+' '+(y+ry*.6)+'" stroke="'+mc+'" stroke-width="'+(2.6*s)+'" stroke-linecap="round"/>'});
  }else if(ex==='happy'){
    [ex1,ex2].forEach(function(cx){o+='<path d="M'+(cx-rx)+' '+(y+2*s)+' Q'+cx+' '+(y-ry*1.4)+' '+(cx+rx)+' '+(y+2*s)+'" stroke="'+mc+'" stroke-width="'+(2.8*s)+'" fill="none" stroke-linecap="round"/>'});
  }else{
    if(ex==='sad'){py=3*s;px=.3*s}
    if(ex==='shock'){pr*=.6;px=0;py=0}
    [ex1,ex2].forEach(function(cx){o+='<ellipse cx="'+cx+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="#fff" stroke="#000" stroke-width="'+lw+'"/><circle cx="'+(cx+px)+'" cy="'+(y+py)+'" r="'+pr+'" fill="#000"/>'});
    if(ex==='angry'||ex==='taunt'){
      o+='<path d="M'+(ex1-rx*1.1)+' '+(y-ry-3*s)+' L'+(ex1+rx*.9)+' '+(y-ry+1.5*s)+' M'+(ex2+rx*1.1)+' '+(y-ry-3*s)+' L'+(ex2-rx*.9)+' '+(y-ry+1.5*s)+'" stroke="'+mc+'" stroke-width="'+(2.6*s)+'" stroke-linecap="round"/>';
    }
    if(ex==='sad'){
      o+='<path d="M'+(ex1-rx)+' '+(y-ry+1*s)+' L'+(ex1+rx*.8)+' '+(y-ry-3*s)+' M'+(ex2+rx)+' '+(y-ry+1*s)+' L'+(ex2-rx*.8)+' '+(y-ry-3*s)+'" stroke="'+mc+'" stroke-width="'+(2.4*s)+'" stroke-linecap="round"/>';
    }
  }
  var my=y+ry+5*s,w=7.5*s;
  if(ex==='happy'||ex==='taunt'){
    o+='<path d="M'+(x-w*1.2)+' '+my+' Q'+x+' '+(my+15*s)+' '+(x+w*1.2)+' '+my+'Z" fill="#8a1c1c" stroke="'+mc+'" stroke-width="'+(1.8*s)+'" stroke-linejoin="round"/><path d="M'+(x-w*.5)+' '+(my+6*s)+' Q'+x+' '+(my+3*s)+' '+(x+w*.5)+' '+(my+6*s)+' Q'+x+' '+(my+9*s)+' '+(x-w*.5)+' '+(my+6*s)+'Z" fill="#ff7a8a"/>';
  }else if(ex==='sad'){
    o+='<path d="M'+(x-w)+' '+(my+5*s)+' Q'+x+' '+(my-3*s)+' '+(x+w)+' '+(my+5*s)+'" stroke="'+mc+'" stroke-width="'+(2.2*s)+'" fill="none" stroke-linecap="round"/>';
  }else if(ex==='shock'||ex==='dizzy'){
    o+='<ellipse cx="'+x+'" cy="'+(my+4*s)+'" rx="'+(4*s)+'" ry="'+(5.5*s)+'" fill="#8a1c1c" stroke="'+mc+'" stroke-width="'+(1.8*s)+'"/>';
  }else if(ex==='angry'){
    o+='<rect x="'+(x-w)+'" y="'+my+'" width="'+(2*w)+'" height="'+(6*s)+'" rx="'+(2*s)+'" fill="#fff" stroke="'+mc+'" stroke-width="'+(1.6*s)+'"/><path d="M'+(x-w)+' '+(my+3*s)+' H'+(x+w)+'" stroke="#000" stroke-width="'+s+'"/>';
  }else{
    o+='<path d="M'+(x-w)+' '+my+' Q'+x+' '+(my+7*s)+' '+(x+w)+' '+my+'" stroke="'+mc+'" stroke-width="'+(2.2*s)+'" fill="none" stroke-linecap="round"/>';
  }
  return o;
}
function limbs(c,pose){
  var ax=c.a,lx=c.l,xl=ax[0],xr=ax[1],y=ax[2],L,R;
  switch(pose){
    case 'cheer':L=[[xl,y],[xl-11,y-9],[xl-13,y-24]];R=[[xr,y],[xr+11,y-9],[xr+13,y-24]];break;
    case 'pump':L=[[xl,y],[xl-9,y+10],[xl-12,y+22]];R=[[xr,y],[xr+13,y-3],[xr+15,y-18]];break;
    case 'throw':L=[[xl,y],[xl-9,y+10],[xl-12,y+22]];R=[[xr,y],[xr+13,y-5],[xr+27,y-9]];break;
    case 'flail':L=[[xl,y],[xl-15,y-3],[xl-10,y-18]];R=[[xr,y],[xr+15,y+3],[xr+22,y-9]];break;
    case 'sad':L=[[xl,y],[xl-4,y+12],[xl-3,y+24]];R=[[xr,y],[xr+4,y+12],[xr+3,y+24]];break;
    case 'hold':L=[[xl,y],[xl-10,y-6],[xl-2,y-22]];R=[[xr,y],[xr+10,y-6],[xr+2,y-22]];break;
    default:L=[[xl,y],[xl-9,y+10],[xl-12,y+22]];R=[[xr,y],[xr+9,y+10],[xr+12,y+22]];
  }
  var legL=[[lx[0],lx[2]],[lx[0]-3,112],[lx[0]-10,112]],legR=[[lx[1],lx[2]],[lx[1]+3,112],[lx[1]+10,112]];
  if(pose==='flail'){legL=[[lx[0],lx[2]],[lx[0]-10,lx[2]+12],[lx[0]-16,lx[2]+8]];legR=[[lx[1],lx[2]],[lx[1]+8,lx[2]+14],[lx[1]+16,lx[2]+16]]}
  function pl(p){return p.map(function(q){return q[0]+','+q[1]}).join(' ')}
  var o='',all=[L,R,legL,legR];
  if(c.lo)all.forEach(function(p){o+='<polyline points="'+pl(p)+'" fill="none" stroke="'+c.lo+'" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>'});
  all.forEach(function(p){o+='<polyline points="'+pl(p)+'" fill="none" stroke="'+(c.lc||'#111')+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'});
  return o;
}
var svgCache={};
function charSVG(id,ex,pose,flip){
  var c=CH[id];ex=ex||'idle';pose=pose||'idle';
  if(ex==='idle'&&c.mood)ex=c.mood;
  var k=id+'|'+ex+'|'+pose+'|'+(flip?1:0);
  if(svgCache[k])return svgCache[k];
  var f=c.f;
  var s='<svg class="csvg" viewBox="-14 -14 128 130" aria-hidden="true"><g'+(flip?' transform="translate(100,0) scale(-1,1)"':'')+'>'+limbs(c,pose)+c.b+face(f[0],f[1],f[2],ex,f[3])+'</g></svg>';
  svgCache[k]=s;return s;
}

}
function buildGrid(){
  var h='<button class="card rand" data-id="rand" aria-label="Random"><div class="pic">?</div><div class="nm">Random!</div></button>';
  CH.forEach(function(c){h+='<button class="card" data-id="'+c.id+'" aria-label="'+c.n+'"><div class="pic">'+charSVG(c.id)+'</div><div class="nm">'+c.n+'</div></button>'});
  $('#grid').innerHTML=h;
}
function selectChar(id,quiet){
  selId=id;
  $$('.card').forEach(function(el){el.classList.toggle('sel',el.getAttribute('data-id')===String(id))});
  $('#sel-av').innerHTML=charSVG(id,'happy','cheer');
  $('#sel-who').innerHTML=CH[id].n+'<small>Ready to battle!</small>';
  $('#btn-play').disabled=false;
  if(!quiet)Snd.play('select');
}
$('#grid').addEventListener('click',function(e){
  var el=e.target.closest('.card');if(!el)return;
  var id=el.getAttribute('data-id');
  if(id==='rand'){id=rnd(CH.length);var t=$('.card[data-id="'+id+'"]');if(t&&t.scrollIntoView)t.scrollIntoView({block:'nearest',behavior:'smooth'})}
  selectChar(+id);
});
$('#btn-play').addEventListener('click',function(){if(selId===null)return;Snd.play('tap');Store.set('lastChar',selId);newTournament(selId)});
function goSelect(){
  ST.flow++;ST.phase='select';renderStats();
  show('s-select');
  var last=Store.get('lastChar',null);
  if(selId===null&&last!==null&&CH[last])selectChar(last,true);
}

/* ---------- tournament ---------- */
function newTournament(youId){
  ST.flow++;ST.you=youId;
  var others=shuffle(CH.map(function(c){return c.id}).filter(function(i){return i!==youId})).slice(0,15);
  ST.pos=rnd(16);others.splice(ST.pos,0,youId);
  ST.slots=others;ST.round=0;ST.winners=[[],[],[],[]];ST.lastRound=null;
  Store.inc('played');
  goBracket();
}
function simulateRound(r){
  var e=entrants(r),n=e.length/2,me=ST.pos>>(r+1);
  for(var m=0;m<n;m++)ST.winners[r][m]=(m===me)?ST.you:(Math.random()<.5?e[2*m]:e[2*m+1]);
}
function goBracket(){
  ST.flow++;ST.phase='bracket';show('s-bracket');
  var r=ST.round;
  $('#br-title').textContent=STAGES[r];
  $('#steps').innerHTML=['Round of 16','Quarter','Semi','Final'].map(function(s,i){return '<div class="step '+(i<r?'done':i===r?'now':'')+'">'+s+'</div>'}).join('');
  ST.opp=oppFor(r);
  $('#nextpanel').innerHTML='<div class="vsrow"><div class="side"><div class="av">'+charSVG(ST.you,'happy','cheer')+'</div><div class="nm">'+CH[ST.you].n+' (You)</div></div><div class="vs outline" style="color:#fff">VS</div><div class="side"><div class="av">'+charSVG(ST.opp,'taunt','pump',true)+'</div><div class="nm">'+CH[ST.opp].n+'</div></div></div><button class="btn green" id="btn-fight">FIGHT!</button>';
  $('#btn-fight').addEventListener('click',function(){Snd.play('tap');startMatch()});
  drawBracket();requestAnimationFrame(drawBracket);
}
function drawBracket(){
  var box=$('#bracket');if(!box.offsetParent)return;
  var W=box.clientWidth,H=box.clientHeight,pad=6;
  var colW=(W-pad*2)/7,rowH=(H-pad*2)/8;
  var av=Math.max(22,Math.min(colW*.84,rowH*.84,64));
  function colX(c){return pad+colW*(c+.5)}
  function pos(r,i){
    var cnt=16>>r,half=cnt/2,left=i<half,j=left?i:i-half;
    if(r===3)return{x:colX(3),y:H/2+(left?-1:1)*Math.max(av*1.25,H*.17)};
    return{x:colX(left?r:6-r),y:pad+(H-pad*2)*(j+.5)/half};
  }
  var lines='',nodes='',curR=ST.round,nextOpp=ST.opp;
  for(var r=0;r<4;r++){
    var e=entrants(r),cnt=16>>r;
    for(var i=0;i<cnt;i++){
      var p=pos(r,i),id=e[i],win=ST.winners[r][i>>1];
      var adv=(id!==undefined&&win===id),isYou=adv&&id===ST.you;
      if(r<3){
        var q=pos(r+1,i>>1),mx=(p.x+q.x)/2;
        lines+='<path d="M'+p.x+' '+p.y+' H'+mx+' V'+q.y+' H'+q.x+'" fill="none" stroke="'+(isYou?'#ffc83d':adv?'#fff':'rgba(27,27,47,.28)')+'" stroke-width="'+(adv?4:2.5)+'" stroke-linejoin="round"/>';
      }else{
        lines+='<path d="M'+p.x+' '+p.y+' V'+H/2+'" stroke="'+(isYou?'#ffc83d':'rgba(27,27,47,.28)')+'" stroke-width="3"/>';
      }
      var cls='bav',inner='?';
      if(id===undefined)cls+=' q';
      else{
        var lost=(win!==undefined&&win!==id);
        inner='<div class="inner">'+charSVG(id,lost?'sad':'idle','idle',(i>=cnt/2))+'</div>';
        if(lost)cls+=' out';
        if(id===ST.you)cls+=' you';
        if(r===curR&&id===nextOpp)cls+=' next';
        if(r===curR&&id===ST.you&&ST.lastRound===r-1)cls+=' pop';
      }
      nodes+='<div class="'+cls+'" style="left:'+p.x+'px;top:'+p.y+'px;width:'+av+'px;height:'+av+'px;font-size:'+(av*.5)+'px">'+inner+'</div>';
    }
  }
  var ts=Math.min(av*1.3,colW*1.15);
  nodes+='<div class="champ-slot" style="left:'+colX(3)+'px;top:'+H/2+'px;width:'+ts+'px;height:'+ts+'px">'+TROPHY+'</div>';
  box.innerHTML='<svg class="lines" viewBox="0 0 '+W+' '+H+'">'+lines+'</svg>'+nodes;
}
window.addEventListener('resize',function(){if(ST.phase==='bracket')drawBracket()});

/* ---------- match ---------- */
var bubbleT=null;
function say(text,ms){var b=$('#bubble');b.textContent=text;b.classList.add('show');clearTimeout(bubbleT);bubbleT=setTimeout(function(){b.classList.remove('show')},(ms||2200)*Math.max(SPEED,.5))}
function hush(){clearTimeout(bubbleT);$('#bubble').classList.remove('show')}
function setFig(who,ex,pose,cls){var el=$('#fig-'+who);el.className='fig'+(cls?' '+cls:'');el.innerHTML=charSVG(who==='you'?ST.you:ST.opp,ex,pose,who==='opp')}
function renderPips(){['you','opp'].forEach(function(w,k){var h='';for(var i=0;i<2;i++)h+='<div class="pip'+(i<ST.score[k]?' on':'')+'"></div>';$('#pips-'+w).innerHTML=h})}
function setPicks(on){$$('.pick').forEach(function(b){b.disabled=!on;b.classList.remove('chosen')});$('#taphint').style.display=on?'':'none'}
function clearThrows(){['you','opp'].forEach(function(w){var t=$('#t-'+w);t.className='throw';t.innerHTML=''})}
function cmsg(big,sub){var c=$('#cmsg');c.className='cmsg outline';c.innerHTML=big?'<div class="big">'+big+'</div>'+(sub?'<div class="sub">'+sub+'</div>':''):'';if(big){void c.offsetWidth;c.classList.add('pop')}}
function startMatch(){
  ++ST.flow;ST.score=[0,0];ST.opp=oppFor(ST.round);
  show('s-match');
  $('#m-round').textContent=STAGES[ST.round];
  $('#m-youname').textContent=CH[ST.you].n+' (You)';
  $('#m-oppname').textContent=CH[ST.opp].n;
  renderPips();clearThrows();cmsg('');
  setFig('you','idle','idle','bob');setFig('opp','taunt','pump','bob');
  setPicks(true);ST.phase='await-pick';
  var sp=SPECIAL[CH[ST.opp].n];
  say(sp&&Math.random()<.7?pick(sp):pick(TAUNTS),2600);
}
function aiMove(p){
  if(ST.aiMode==='lose')return (p+2)%3;
  if(ST.aiMode==='win')return (p+1)%3;
  if(ST.aiMode==='tie')return p;
  var easy=[.3,.15,.05,0][ST.round]||0;
  if(Math.random()<easy)return (p+2)%3;
  return rnd(3);
}
var VERB={'0-2':'Rock smashes Scissors!','1-0':'Paper covers Rock!','2-1':'Scissors cut Paper!'};
function onPick(m){
  if(ST.phase!=='await-pick')return;
  ST.phase='throwing';
  $$('.pick').forEach(function(b){b.disabled=true});
  $('.pick[data-m="'+m+'"]').classList.add('chosen');
  $('#taphint').style.display='none';
  Snd.play('tap');hush();
  playRound(m,ST.flow);
}
async function playRound(m,my){
  clearThrows();
  var words=['Rock...','Paper...','Scissors...'];
  for(var i=0;i<3;i++){
    cmsg(words[i],'<b style="font-size:1.3em;padding:0 6px">'+(3-i)+'</b>');Snd.play('tick');
    setFig('you','angry',i%2?'idle':'pump','shake');setFig('opp','angry',i%2?'idle':'pump','shake');
    await wait(430);if(my!==ST.flow)return;
  }
  var o=aiMove(m);
  cmsg('SHOOT!','');Snd.play('shoot');
  var ty=$('#t-you'),to=$('#t-opp');
  ty.innerHTML=moveSVG(m);to.innerHTML=moveSVG(o);
  ty.className='throw show';to.className='throw show';
  setFig('you','shock','throw');setFig('opp','shock','throw');
  ST.phase='reveal';
  await wait(650);if(my!==ST.flow)return;
  var res=(m===o)?0:((m-o+3)%3===1?1:-1);
  if(res===0){
    ST.phase='result-tie';
    cmsg('TIE!','Go again!');Snd.play('tie');
    setFig('you','shock','flail','hit');setFig('opp','shock','flail','hit');
    say(pick(TIE_LINES),1400);
    await wait(1300);if(my!==ST.flow)return;
  }else{
    var youWon=res>0,w=youWon?m:o,l=youWon?o:m;
    ST.score[youWon?0:1]++;renderPips();ST.phase=youWon?'result-win':'result-lose';
    var sub=moveSVG(w).replace('class="csvg"','')+VERB[w+'-'+l];
    if(youWon){cmsg('YOU WIN!',sub);Snd.play('win');ty.classList.add('win');to.classList.add('lose');setFig('you','happy','cheer','bounce');setFig('opp','sad','sad','hit');say(pick(LOSE_LINES),1400)}
    else{cmsg('<span style="font-size:'+(CH[ST.opp].n.length>9?'.7em':'1em')+'">'+CH[ST.opp].n+' wins!</span>',sub);Snd.play('lose');to.classList.add('win');ty.classList.add('lose');setFig('opp','happy','cheer','bounce');setFig('you','sad','sad','hit');say(pick(WIN_LINES),1400)}
    await wait(1500);if(my!==ST.flow)return;
    if(ST.score[0]>=2||ST.score[1]>=2){endMatch(ST.score[0]>=2,my);return}
  }
  clearThrows();cmsg('');
  setFig('you','idle','idle','bob');setFig('opp','taunt','pump','bob');
  setPicks(true);ST.phase='await-pick';
}
function addPow(who){
  var f=$('#fig-'+who),a=$('#arena'),r=f.getBoundingClientRect(),ar=a.getBoundingClientRect();
  var p=document.createElement('div');p.className='pow';p.innerHTML=POW;
  p.style.left=(r.left-ar.left+r.width/2-45)+'px';p.style.top=(r.top-ar.top+r.height*.3-45)+'px';
  a.appendChild(p);setTimeout(function(){p.remove()},900);
}
async function endMatch(youWon,my){
  ST.phase='ending';clearThrows();
  var winner=youWon?'you':'opp',loser=youWon?'opp':'you';
  cmsg(youWon?'VICTORY!':'OH NO!','');
  setFig(winner,'happy','cheer','bounce');setFig(loser,'shock','flail');
  if(youWon)say(pick(['Nooooo!','Waaaah!','I\'ll be back!','Not fair!']),1600);else say(pick(MATCH_WIN_LINES),1600);
  await wait(500);if(my!==ST.flow)return;
  addPow(loser);Snd.play('bonk');
  setFig(loser,'dizzy','flail',loser==='you'?'flingL':'flingR');
  Snd.play('whoosh');
  await wait(1500);if(my!==ST.flow)return;
  hush();
  if(youWon){
    Store.inc('wins');simulateRound(ST.round);
    ST.lastRound=ST.round;ST.round++;
    if(ST.round>=4){goChampion();return}
    Snd.play('cheer');goBracket();
  }else{Store.inc('losses');goRecovery()}
}
$('#picks').addEventListener('click',function(e){var b=e.target.closest('.pick');if(!b||b.disabled)return;onPick(+b.getAttribute('data-m'))});

/* ---------- recovery ---------- */
var BANDAGE='<svg viewBox="0 0 100 40" style="position:absolute;left:30%;top:6%;width:44%;height:18%;overflow:visible"><g transform="rotate(-14 50 20)"><rect x="4" y="8" width="92" height="24" rx="10" fill="#ffd8b0" stroke="#a0704a" stroke-width="3"/><rect x="36" y="10" width="28" height="20" rx="3" fill="#f5c08f"/></g></svg>';
function goRecovery(){
  ST.flow++;ST.phase='recovery';show('s-recovery');Snd.play('sad');
  $('#rec-scene').innerHTML=recoverySVG()+'<div class="who" style="left:35%;top:43%;width:30%;height:46%">'+charSVG(ST.you,'dizzy','sad')+BANDAGE+'</div><div class="who" style="right:0;top:52%;width:22%;height:36%">'+charSVG(ST.opp,'happy','cheer',true)+'</div>';
  $('#rec-msg').innerHTML=CH[ST.opp].n+' flung you!<br>Don\'t give up!';
}
$('#btn-retry').addEventListener('click',function(){Snd.play('tap');startMatch()});

/* ---------- champion ---------- */
var confRAF=null;
function goChampion(){
  ST.flow++;ST.phase='champion';
  var c=Store.inc('champs');
  show('s-champ');Snd.play('fanfare');
  $('#champ-scene').innerHTML=islandSVG()+'<div class="who" style="left:33%;top:36%;width:34%;height:50%">'+charSVG(ST.you,'happy','hold')+'</div><div class="who trophy-float" style="left:39%;top:2%;width:22%;height:32%">'+TROPHY+'</div>';
  $('#champ-msg').innerHTML=CH[ST.you].n+' wins it all!<br>Cups won: '+c;
  startConfetti();
}
function startConfetti(){
  var cv=$('#confetti'),ctx=cv.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2);
  function size(){cv.width=Math.round(cv.clientWidth*dpr);cv.height=Math.round(cv.clientHeight*dpr)}
  size();
  var cols=['#ff5a5a','#ffc83d','#2fbf4a','#2f8cff','#c46bff','#ff8fd6','#fff'],P=[];
  for(var i=0;i<140;i++)P.push({x:Math.random()*cv.width,y:Math.random()*cv.height-cv.height*.6,vx:(Math.random()-.5)*2*dpr,vy:(1.5+Math.random()*3)*dpr,s:(6+Math.random()*7)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols)});
  stopConfetti();
  (function loop(){
    if(cv.width!==Math.round(cv.clientWidth*dpr))size();
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y>cv.height+20){p.y=-20;p.x=Math.random()*cv.width}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    confRAF=requestAnimationFrame(loop);
  })();
}
function stopConfetti(){if(confRAF)cancelAnimationFrame(confRAF);confRAF=null}

/* ---------- settings ---------- */
function renderSound(){$('#btn-sound').textContent='Sound: '+(Snd.on?'ON':'OFF');$('#btn-sound').className='btn '+(Snd.on?'blue':'')}
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-act]');if(!a)return;
  var act=a.getAttribute('data-act');
  if(act==='settings'){Snd.play('tap');renderStats();renderSound();$('#settings').classList.add('on')}
  if(act==='new'){Snd.play('tap');$('#settings').classList.remove('on');hush();goSelect()}
});
$('#btn-close').addEventListener('click',function(){Snd.play('tap');$('#settings').classList.remove('on')});
$('#settings').addEventListener('click',function(e){if(e.target.id==='settings')$('#settings').classList.remove('on')});
$('#btn-sound').addEventListener('click',function(){Snd.on=!Snd.on;Store.set('sound',Snd.on);renderSound();Snd.play('select')});

/* ---------- iOS: block page scroll / pinch / double-tap zoom (except the roster list) ---------- */
document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1){e.preventDefault();return}if(!e.target.closest||!e.target.closest('.scroll'))e.preventDefault()},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault()},{passive:false})});
document.addEventListener('dblclick',function(e){e.preventDefault()},{passive:false});
document.addEventListener('touchstart',function(){},{passive:true});
document.addEventListener('contextmenu',function(e){e.preventDefault()});

/* ---------- init ---------- */
$$('.gear').forEach(function(g){g.innerHTML=GEAR});
$$('.pick').forEach(function(b){b.querySelector('.ic').outerHTML=moveSVG(+b.getAttribute('data-m')).replace('class="csvg"','')});
buildGrid();
goSelect();

/* test/debug hooks (harmless during normal play) */
window.__BFDI={
  roster:function(){return CH.map(function(c){return c.n})},
  state:function(){return{phase:ST.phase,round:ST.round,score:ST.score.slice(),you:ST.you,opp:ST.opp,youName:ST.you!=null?CH[ST.you].n:null,oppName:ST.opp!=null?CH[ST.opp].n:null,storage:Store.mode(),bracketFilled:ST.winners.map(function(w){return w.filter(function(x){return x!==undefined}).length})}},
  setAI:function(m){ST.aiMode=m||null},
  setSpeed:function(x){SPEED=x},
  stats:function(){return{wins:Store.get('wins',0),champs:Store.get('champs',0),played:Store.get('played',0),losses:Store.get('losses',0)}},
  iconHTML:function(){return '<div id="icon" style="width:180px;height:180px;background:linear-gradient(#49b4ff,#a8e2ff 68%,#5cbf35 68.5%);position:relative;overflow:hidden"><div style="position:absolute;left:-6px;top:40px;width:104px;height:106px">'+charSVG(0,'taunt','pump')+'</div><div style="position:absolute;right:-6px;top:40px;width:104px;height:106px">'+charSVG(1,'taunt','pump',true)+'</div><div style="position:absolute;left:0;right:0;top:6px;text-align:center;font:900 34px Arial Black,Arial,sans-serif;color:#fff;text-shadow:2px 2px 0 #1b1b2f,-2px 2px 0 #1b1b2f,2px -2px 0 #1b1b2f,-2px -2px 0 #1b1b2f,0 4px 0 #1b1b2f">BFDI</div><div style="position:absolute;left:68px;top:120px;width:44px;height:44px">'+moveSVG(2)+'</div></div>'}
};
})();
</script>
